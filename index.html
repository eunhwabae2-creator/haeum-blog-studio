/* Stitch reference: PropTech Editorial Calm */
html{--bg:#f7f8fa;--panel:#fff;--ink:#19243a;--muted:#59677d;--line:#e4e7ee;--soft:#efedff;--alt:#f3f5f9;--accent:#422ec2;--save:#22b573;--save-text:#103524;scroll-padding-top:88px}
html.dark{--alt:#2e293f;--accent:#d7ceff}
body{font-family:Inter,Pretendard,system-ui,sans-serif}
h1,h2,h3,.logo,.site-brand{font-family:"Plus Jakarta Sans",Inter,Pretendard,system-ui,sans-serif}
.hero{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:24px}
.hero p,.eyebrow{color:var(--muted)}
.card,details.box{box-shadow:0 1px 3px #16233c0d}
button,input,select,textarea{border-radius:12px}
button{min-height:36px}
button.primary,button.green{min-height:44px}
button.primary:hover{background:#4939c7}
button.green{background:var(--save);color:var(--save-text)}
button.green:hover{background:#28c37f}
.tag,.site-pill{border-radius:999px}
.tag button{min-height:28px}
.site-wrap{width:min(1280px,100% - 48px);margin-inline:auto}
.site-header{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}
.site-nav{display:flex;min-height:68px;align-items:center;justify-content:space-between;gap:16px}
.site-brand{text-decoration:none;font-weight:800;white-space:nowrap}
.site-brand span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--purple);color:#fff}
.site-nav nav{display:flex;gap:22px;font-size:14px}
.site-nav nav a,.site-link{text-decoration:none;font-weight:700}
.site-nav nav a:hover,.site-link:hover{text-decoration:underline}
.site-hero{background-color:var(--panel);background-image:linear-gradient(to right,var(--bg) 1px,transparent 1px),linear-gradient(to bottom,var(--bg) 1px,transparent 1px);background-size:150px 100px;padding:clamp(44px,8vw,108px) 0}
.hero-split{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(24px,5vw,68px)}
.site-hero h1{margin:16px 0 12px;font-size:clamp(28px,3.6vw,46px)}
.site-hero p,.site-section p{color:var(--muted)}
.site-pill{display:inline-block;background:var(--soft);color:var(--accent);padding:4px 10px;font-size:12px;font-weight:750}
.site-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.site-facts strong,.site-facts small{display:block}
.site-facts strong{color:var(--accent);font-size:23px}
.studio-demo,.site-section article,.quality-total{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.studio-demo{min-width:0;box-shadow:0 12px 26px #16233c15}
.studio-demo h3{margin:14px 0 10px;padding:10px 12px;background:var(--alt);border-radius:8px}
.demo-top,.demo-footer,.criterion{display:flex;gap:8px;justify-content:space-between;align-items:center}
.demo-top{border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--muted);font-size:12px}
.demo-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin:14px 0;font-size:13px}
.demo-grid>div{background:var(--alt);border-radius:10px;padding:11px;min-width:0}
.demo-grid p{margin:4px 0}
.demo-footer{background:var(--soft);padding:10px 12px;border-radius:8px;font-size:12px}
.site-section{padding:clamp(40px,6vw,76px) 0;background:var(--panel)}
.site-alt{background:var(--alt)}
.site-title{text-align:center;margin-bottom:24px}
.site-section h2,.site-cta h2{font-size:clamp(22px,2.5vw,30px)}
.site-three,.site-two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.site-two{grid-template-columns:repeat(2,minmax(0,1fr))}
.site-section article h3{margin-top:8px}
.site-section article p{margin:0;font-size:14px}
.quality-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px}
.quality-total{display:grid;place-content:center;text-align:center;background:var(--alt)}
.quality-total strong{font-size:44px;color:var(--accent);line-height:1.2}
.site-section .criterion{padding:12px;font-size:13px}
.criterion span{white-space:nowrap}
.site-cta{background:#242a46;color:#fff;padding:35px 0}
.site-cta .row{justify-content:space-between}
.site-cta h2{margin:0}
.site-footer{padding-block:18px;color:var(--muted);font-size:13px}

@media(max-width:900px){.site-nav nav{display:none}.hero-split{grid-template-columns:1fr}.quality-layout{grid-template-columns:1fr}.quality-total{grid-auto-flow:column;align-items:center;gap:12px}}

.brand-logo{width:38px;height:38px;object-fit:contain;border-radius:8px;vertical-align:middle;margin-right:5px}
.brand-phone{white-space:nowrap;font-weight:750;font-size:14px;color:var(--accent)}
.site-brand{white-space:normal}
@media(max-width:1100px){.site-nav nav{display:none}}

 return ['정보 기준일: '+d.informationDate.replaceAll('-','.'),d.officeProfile.position==='상단'?office:'',d.reader,...d.outline.map(o=>'■ '+o.heading+'\n'+(o.notes||'[확인 필요: '+o.heading+' 근거와 설명]')+(o.link&&safeURL(o.link)?'\n'+o.link:'')+(o.emphasis?'\n'+o.emphasis:'')+(o.image?'\n[이미지: '+o.image+']':'')),'■ 직접 경험\n'+experience,'■ 대안 비교\n| 대안 | 검토할 기준 |\n| 후보 유지 | 근거 자료와 조건 확인 |\n| 대체 후보 비교 | 비용·일정·생활 여건 확인 |','■ FAQ\nQ. 무엇부터 확인하나요?\n기준일과 대상 범위를 확인합니다. 조건이 같은 자료끼리 비교합니다.\n\nQ. 자료가 다르면 어떻게 하나요?\n발표일과 적용 범위를 비교합니다. 불일치가 남으면 발행 전에 확인합니다.\n\nQ. 어떤 기준으로 후보를 비교하나요?\n독자 목적에 맞춰 비용, 일정, 생활 여건을 비교합니다. 근거가 없는 항목은 따로 표시합니다.','■ 참고 자료\n'+(details.join('\n')||'[확인 필요: 원문 링크]'),d.officeProfile.position==='하단'?office:''].filter(Boolean).join('\n\n');

function validateEvaluation(e,article){

function rich(article){
 return article.split(/\n{2,}/).map(chunk=>{
 const lines=chunk.split('\n');let out='',rows=[];
 const flush=()=>{if(rows.length){out+='<table style="border-collapse:collapse;width:100%">'+rows.map(r=>'<tr>'+r.map(cell=>'<td style="border:1px solid #b5aebe;padding:6px">'+esc(cell)+'</td>').join('')+'</tr>').join('')+'</table>';rows=[];}};
 for(const l of lines){
 if(/^\s*\|.+\|\s*$/.test(l)){const r=l.trim().slice(1,-1).split('|');if(!r.every(c=>/^[: -]+$/.test(c)))rows.push(r);continue;}
 flush();
 const body=esc(l).replace(/\[(?:확인 필요|작성자 경험 입력)[^\]]*\]/g,s=>'<span style="background:#ffed97;color:#302610">'+s+'</span>');
 out+=l.startsWith('■')?'<p style="font-size:20px;font-weight:700;margin:16px 0 6px">'+body+'</p>':'<p style="margin:4px 0;line-height:1.75">'+(safeURL(l)?'<a href="'+attr(l)+'">'+esc(l)+'</a>':body)+'</p>';
 }flush();return out;
 }).join('');
}

}
function archiveView(){return card('보관함','<label class="field">제목·주제·키워드 검색<input id="search" value="'+attr(search)+'"></label><div id="archiveList">'+archiveItems()+'</div><label class="field">프로젝트 JSON 가져오기<input type="file" id="import" accept=".json,application/json"></label>'+btn('json','현재 초안 JSON 내보내기'));}

function putArticle(text){
 if(d.article&&!confirm('현재 원고를 바꿀까요? 변경 취소로 한 번 되돌릴 수 있습니다.'))return false;

}
function list(obj,k,min,max,len){const a=obj?.[k];if(!Array.isArray(a)||a.length<min||a.length>max||a.some(v=>typeof v!=='string'||!v.trim()||v.length>len))throw Error(k+' 목록의 개수와 길이를 확인하세요.');const clean=a.map(s=>s.trim());if(new Set(clean.map(x=>x.toLowerCase())).size!==clean.length)throw Error('목록에 중복 항목이 있습니다.');return clean;}
function apply(){
 const raw=$('#aiResult').value.trim();if(!raw||raw.length>180000)throw Error('붙여넣은 결과의 내용과 길이를 확인하세요.');
 const articleTask=['generateArticle','reviseArticle'].includes(task);
 let result;
 if(articleTask&&!/^[{`]/.test(raw)) result={article:raw};else {try{result=parse(raw);}catch{throw Error('JSON 형식이 올바르지 않습니다. AI 응답 전체를 다시 붙여넣으세요.');}}
 if(articleTask){if(typeof result?.article!=='string'||!result.article.trim())throw Error('article에 본문이 필요합니다.');if(!putArticle(result.article))return;}
 if(task==='suggestKeywords')d.keywords=list(result,'keywords',5,10,65);
 if(task==='suggestEmphasis')d.emphasis=list(result,'emphasis',1,20,300);
 if(task==='generateTitles')d.titles=list(result,'titles',3,3,50);
 if(task==='generateOutline'){
 const titles=list(result,'titles',3,3,50);
 if(typeof result.reader!=='string'||!result.reader.trim()||typeof result.meta!=='string'||!result.meta.trim()||result.meta.length>160||!Array.isArray(result.outline)||result.outline.length<8||result.outline.length>30)throw Error('예상 독자, 메타 설명(160자 이내), 아웃라인(8개 이상)을 확인하세요.');
 const outline=result.outline.map(o=>{if(!o||typeof o.heading!=='string'||!o.heading.trim()||o.heading.length>120||typeof o.notes!=='string'||(o.link&&!safeURL(o.link)))throw Error('소제목, 메모, 근거 링크를 확인하세요.');return Object.fromEntries(Object.keys(section()).map(k=>[k,typeof o[k]==='string'?o[k]:'']));});
 Object.assign(d,{titles,reader:result.reader,meta:result.meta,outline});
 }
 if(task==='evaluateArticle')d.evaluation=validateEvaluation(result,d.article);
 task='';jobInput=jobError='';save();render();say('결과를 적용했습니다.');
}
function addTag(){
 const tags=$('#tagInput').value.split(',').map(s=>s.trim()).filter(Boolean);
 if(!tags.length)return;
 const all=[...d.keywords,...tags];if(all.length>10||new Set(all.map(s=>s.toLowerCase())).size!==all.length){say('키워드는 중복 없이 최대 10개까지 등록할 수 있습니다.');return;}
 d.keywords=all;save();render();$('#tagInput').focus();
}
function next(){
 if(step===1){

 if(d.sources.some(s=>s.url&&!safeURL(s.url))){say('참고 자료에 올바른 HTTP 또는 HTTPS 주소를 입력하세요.');return;}
 if(!d.outline.length)Object.assign(d,outlineFor(d));
 }
 if(step===2){
 if(!d.title.trim()){say('제목을 선택하거나 직접 입력하세요.');return;}
 if(d.outline.length<3||d.outline.some(o=>!o.heading.trim()||(o.link&&!safeURL(o.link)))){say('소제목 3개 이상과 근거 URL 형식을 확인하세요.');return;}
 }
 step=Math.min(3,step+1);task='';save();render();window.scrollTo(0,0);
}

function setField(el){
 const parts=el.dataset.field.split('.');const last=parts.pop();let obj=d;for(const p of parts)obj=obj[p];
 obj[last]=el.value;
 if(el.type==='url')el.setCustomValidity(el.value&&!safeURL(el.value)?'HTTP 또는 HTTPS 주소를 입력하세요.':'');
 if(last==='article'){const had=!!d.evaluation;d.evaluation=null;d.status='초안';if(had){const section=[...document.querySelectorAll('.card')].find(x=>x.querySelector('h2')?.textContent.startsWith('품질 평가'));if(section)section.outerHTML=evaluation();}}
 if(last==='article'||last==='title')updatePreview();
 if(last==='topic'){const ok=!!d.topic.trim();$('[data-act=next]').disabled=!ok;$('[data-act=store]').disabled=!ok;$('#topicHelp').textContent=ok?'다음 단계에서 제목과 아웃라인을 검토합니다.':'주제를 입력해야 다음으로 갈 수 있습니다.';}
 save();
}
async function copy(text,html){
 if(!text.trim()){say('복사할 내용이 없습니다.');return;}
 if(html&&window.ClipboardItem)try{await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);say('네이버용 서식과 텍스트를 복사했습니다. 붙여넣은 뒤 표와 줄바꿈을 확인하세요.');return;}catch{}
 try{await navigator.clipboard.writeText(text);say(html?'서식 없이 텍스트를 복사했습니다.':'복사했습니다.');}catch{const el=document.createElement('textarea');el.value=text;el.setAttribute('aria-label','복사할 텍스트');$('#notice').replaceChildren(document.createTextNode('Ctrl+C로 복사하세요.'),el);clearTimeout(noticeTimer);el.focus();el.select();}
}
const fullText=()=>[d.title,d.article].filter(Boolean).join('\n\n');
const fullHtml=()=>'<p style="font-size:24px;font-weight:700">'+esc(d.title)+'</p>'+rich(d.article);
function file(blob,ext){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(d.topic||'landlanguage').replace(/[<>:"/\\|?*]/g,'-')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function makePng(){
 const lines=d.article.split('\n').filter(x=>/^\s*\|.+\|\s*$/.test(x)&&!/^\s*\|[|: -]+\|\s*$/.test(x)).slice(0,8);
 if(lines.length<2){say('본문에 파이프 구분 비교표를 넣으세요.');return;}
 const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=170+lines.length*80;const ctx=canvas.getContext('2d');
 ctx.fillStyle='#f1eeff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#332776';ctx.font='bold 37px system-ui';ctx.fillText(d.topic+' · 대안 비교',46,72,908);
 lines.forEach((l,i)=>{const y=113+i*80;ctx.fillStyle=i===0?'#5b4bdb':'#fff';ctx.fillRect(46,y,908,67);ctx.fillStyle=i===0?'#fff':'#211d39';ctx.font='25px system-ui';ctx.fillText(l.trim().slice(1,-1).split('|').map(s=>s.trim()).join('   ·   '),65,y+43,865);});
 canvas.toBlob(blob=>{if(blob)file(blob,'png');else say('PNG 저장에 실패했습니다.');},'image/png');
}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.field)setField(el);
 if(el.id==='emphasis'){d.emphasis=el.value.split('\n').map(x=>x.trim()).filter(Boolean);save();}
 if(el.id==='feedback')feedback=el.value;
 if(el.id==='aiResult')jobInput=el.value;
 if(el.id==='search'){search=el.value;$('#archiveList').innerHTML=archiveItems();}
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='import')return;
 const f=e.target.files[0];if(!f)return;
 try{
 if(f.size>2000000)throw Error('2MB 이하 프로젝트 JSON을 선택하세요.');
 const imported=importDraft(JSON.parse(await f.text()));
 if(d.topic&&!confirm('현재 작업을 가져온 프로젝트로 바꿀까요?'))return;
 d=imported;page='editor';step=1;task='';save();render();say('프로젝트를 가져왔습니다.');
 }catch(err){say(err.message);}
});
document.addEventListener('keydown',e=>{if(e.target.id==='tagInput'&&['Enter',','].includes(e.key)&&!e.isComposing){e.preventDefault();addTag();}});
document.addEventListener('click',async e=>{
 const trigger=e.target.closest('button[data-act]');if(!trigger||trigger.disabled)return;
 const [a,v]=trigger.dataset.act.split(':');const i=Number(v);
 try {
 if(a==='next'){next();return;}
 if(a==='menu'){menu=!menu;render();return;}
 if(['landing','editor','archive','settings','cardly'].includes(a)){page=a;menu=false;window.scrollTo(0,0);}
 if(a==='theme')dark=!dark;
 if(a==='direct'||a==='news')tab=a;
 if(a==='prev'||a==='step'){step=a==='prev'?Math.max(1,step-1):i;task='';window.scrollTo(0,0);}
 if(a==='job'||a==='improve'){task=a==='improve'?'reviseArticle':v;jobInput=jobError='';if(a==='improve')feedback=d.evaluation.topFixes.join('\n');render();$('#prompt').focus();$('#prompt').scrollIntoView({block:'center'});return;}
 if(a==='closeJob')task='';
 if(a==='apply'){try{apply();}catch(err){jobError=err.message;render();$('#aiResult').focus();}return;}
 if(a==='promptCopy'){await copy($('#prompt').value);return;}
 if(a==='addTag'){addTag();return;}
 if(a==='delTag')d.keywords.splice(i,1);
 if(a==='editTag'){const val=window.prompt('키워드를 수정하세요.',d.keywords[i])?.trim();if(!val)return;if(val.length>65||d.keywords.some((x,j)=>j!==i&&x.toLowerCase()===val.toLowerCase()))throw Error('65자 이하의 중복되지 않은 키워드를 입력하세요.');d.keywords[i]=val;}
 if(a==='addSource'&&d.sources.length<5)d.sources.push({title:'',organization:'',publishedAt:'',url:'',excerpt:'',verified:false});
 if(a==='delSource')d.sources.splice(i,1);
 if(a==='pick')d.title=d.titles[i];
 if(a==='addOutline')d.outline.push(section('새 소제목'));
 if(a==='delOutline')d.outline.splice(i,1);
 if(a==='up'||a==='down'){const j=i+(a==='up'?-1:1);[d.outline[j],d.outline[i]]=[d.outline[i],d.outline[j]];}
 if(a==='scaffold'&&!putArticle(scaffold(d)))return;
 if(a==='undo'&&before!==null){d.article=before;before=null;d.evaluation=null;}
 if(a==='rich'||a==='plain'){
 const n=pending(d.article).length;
 if(n&&!confirm('미완성 칸 '+n+'개가 남았습니다. 그래도 복사할까요?'))return;
 await copy(fullText(),a==='rich'?fullHtml():null);return;}
 if(a==='meta'||a==='tags'){await copy(a==='meta'?d.meta:d.keywords.slice(0,10).map(k=>'#'+k.replace(/[^\p{L}\p{N}_]/gu,'')).join(' '));return;}
 if(a==='png'){makePng();return;}
 if(['txt','html','json'].includes(a)){
 const contents={txt:fullText(),html:'<!doctype html><html lang="ko"><meta charset="utf-8"><title>'+esc(d.title)+'</title><body>'+fullHtml()+'</body></html>',json:JSON.stringify({version:1,draft:d},null,2)};
 file(new Blob([contents[a]],{type:{txt:'text/plain',html:'text/html',json:'application/json'}[a]+';charset=utf-8'}),a);return;}
 if(a==='store'){
 d.status=d.article.trim()&&!pending(d.article).length?'완료':'초안';d.updatedAt=new Date().toISOString();
 archive=[structuredClone(d),...archive.filter(x=>x.id!==d.id)];if(save())say('보관함에 저장했습니다.');render();return;}
 if(['load','clone','delete'].includes(a)){
 const stored=archive.find(x=>x.id===v);if(!stored)return;
 if(a==='delete'){if(!confirm('이 보관함 항목을 삭제할까요?'))return;archive=archive.filter(x=>x.id!==v);}
 else if(a==='clone'){const dup=structuredClone(stored);dup.id=crypto.randomUUID();dup.createdAt=dup.updatedAt=new Date().toISOString();dup.title=(dup.title||dup.topic).slice(0,45)+' (복제)';archive.unshift(dup);say('복제했습니다.');}
 else {if(d.id!==v&&d.topic&&!confirm('현재 작업 대신 보관한 원고를 열까요?'))return;d=structuredClone(stored);page='editor';step=d.article?3:d.outline.length?2:1;task='';before=null;}
 }
 save();render();
 }catch(err){say(err.message||'작업을 완료하지 못했습니다.');}
});
render();
